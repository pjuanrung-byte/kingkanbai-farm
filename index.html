<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>บันทึกกิจกรรมสวนทุเรียน</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --green: #2e7d32; --green-dark: #1b5e20; --bg: #f4f7f4;
    --card: #ffffff; --line: #dfe6df; --text: #1c2b1c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sarabun', 'Noto Sans Thai', -apple-system, sans-serif;
    background: var(--bg); color: var(--text); font-size: 18px;
    padding-bottom: 110px;
  }
  header {
    background: var(--green); color: #fff; padding: 16px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 20px; }
  header p { font-size: 14px; opacity: .9; margin-top: 2px; }
  .card {
    background: var(--card); margin: 12px; padding: 16px;
    border-radius: 14px; border: 1px solid var(--line);
  }
  .card h2 { font-size: 17px; color: var(--green-dark); margin-bottom: 10px; }
  .hint { font-size: 13px; color: #888; font-weight: normal; }
  label { display: block; font-size: 15px; color: #555; margin: 12px 0 6px; }
  select, input[type=text], input[type=number], input[type=date], textarea {
    width: 100%; font-size: 19px; padding: 13px 12px;
    border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
    font-family: inherit;
  }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--green); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 11px 16px; border-radius: 999px; border: 1.5px solid var(--line);
    background: #fff; font-size: 17px; cursor: pointer; user-select: none;
  }
  .chip.on { background: var(--green); color: #fff; border-color: var(--green); }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .hidden { display: none; }
  .multi-row {
    border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px 12px 6px;
    margin-bottom: 12px; background: #fafcfa;
  }
  .multi-row:first-child { margin-top: 2px; }
  .add-row {
    width: 100%; padding: 13px; font-size: 16px; font-weight: bold;
    color: var(--green-dark); background: #e8f5e9; border: 1.5px dashed var(--green);
    border-radius: 10px; margin-top: 2px; font-family: inherit;
  }
  .mr-actions { text-align: right; margin-top: 10px; }
  .plot-line { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #eef2ee; }
  .plot-line label.pl { flex: 1; margin: 0; font-size: 18px; color: var(--text); display: flex; align-items: center; gap: 10px; }
  .plot-line input[type=checkbox] { width: 24px; height: 24px; }
  .plot-line input[type=number] { width: 96px; padding: 9px 8px; font-size: 18px; }
  .plot-line .l { font-size: 14px; color: #666; }
  .preview { margin-top: 12px; padding: 12px; background: #fff8e1; border: 1px solid #ffe082; border-radius: 10px; font-size: 15px; line-height: 1.6; }
  .mr-remove {
    display: inline-block; color: #c62828; font-size: 14px;
    padding: 6px 4px; cursor: pointer; user-select: none;
  }
  .submit-bar {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px;
    background: rgba(255,255,255,.97); border-top: 1px solid var(--line);
  }
  button.submit {
    width: 100%; padding: 16px; font-size: 21px; font-weight: bold;
    color: #fff; background: var(--green); border: none; border-radius: 12px;
    font-family: inherit;
  }
  button.submit:disabled { background: #9e9e9e; }
  #overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,.96);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; z-index: 100; text-align: center; padding: 24px;
  }
  #overlay .big { font-size: 64px; }
  #overlay .msg { font-size: 22px; font-weight: bold; }
  #overlay .sub { font-size: 16px; color: #666; }
</style>
</head>
<body>

<header>
  <h1>📋 บันทึกกิจกรรมสวนทุเรียน</h1>
  <p id="who">กำลังโหลด...</p>
</header>

<div class="card">
  <h2>1. ข้อมูลพื้นฐาน</h2>
  <label>วันที่</label>
  <input type="date" id="f-date">
  <div id="block-plot" class="hidden">
    <label>แปลง <span style="color:#c62828">*</span></label>
    <select id="f-plot"><option value="">— เลือกแปลง —</option></select>
  </div>
  <label>วันนี้ทำอะไรบ้าง (กดเลือกได้หลายอย่าง) <span style="color:#c62828">*</span></label>
  <div class="chips" id="f-acts"></div>
</div>

<div class="card hidden" id="sec-water">
  <h2>2. การรดน้ำ 💧 <span class="hint">(เลือกได้หลายแปลง)</span></h2>
  <div id="water-rows"></div>
  <button type="button" class="add-row" id="btn-add-water">+ เพิ่มแปลง</button>
</div>

<div class="card hidden" id="sec-fert">
  <h2>3. ปุ๋ยทางดิน 🌿 <span class="hint">(เลือกได้หลายแปลง)</span></h2>
  <div id="fert-rows"></div>
  <button type="button" class="add-row" id="btn-add-fert">+ เพิ่มแปลง</button>
</div>

<div class="card hidden" id="sec-spray">
  <h2>4. ถังพ่น 💦 <span class="hint">(ยา + ปุ๋ยทางใบ ที่ผสมในถังเดียวกัน)</span></h2>
  <label>① ติ๊กแปลงที่พ่น และใส่น้ำที่ใช้ (ลิตร) <span style="color:#c62828">*</span></label>
  <div id="spray-plots"></div>
  <label>② สารที่ใส่ — ปริมาณ <b>ต่อน้ำ 200 ลิตร</b> ตามข้อความใน Line <span style="color:#c62828">*</span></label>
  <div style="margin:4px 0 10px;padding:10px 12px;background:#ffebee;border:1.5px solid #e57373;border-radius:10px;color:#b71c1c;font-weight:bold;font-size:17px">🚫 ห้ามเติมสารอื่นนอกจากที่เขียนไว้</div>
  <div id="spray-rows"></div>
  <button type="button" class="add-row" id="btn-add-spray">+ เพิ่มสาร</button>
  <div id="spray-preview" class="preview hidden"></div>
  <label>③ 📷 ถ่ายรูปฉลากยาทุกขวด <span id="spray-photo-req" style="color:#c62828"></span></label>
  <input type="file" accept="image/*" multiple id="f-spray-photo">
  <div id="spray-photo-count" class="hint" style="margin-top:6px"></div>
</div>

<div class="card">
  <h2>5. เจอโรคหรือแมลงไหม? 🔍</h2>
  <div class="chips" id="f-pests"></div>
</div>

<div class="card">
  <h2>6. หมายเหตุ (ถ้ามี)</h2>
  <textarea id="f-note" rows="2" placeholder="พิมพ์เพิ่มเติม เช่น ต้นไหนผิดปกติ"></textarea>
  <label>ชื่อผู้บันทึก</label>
  <input type="text" id="f-name">
</div>

<div class="submit-bar">
  <button class="submit" id="btn-submit" disabled>✅ ส่งข้อมูล</button>
  <div id="submit-hint" style="color:#c62828;text-align:center;margin-top:8px;font-size:15px"></div>
</div>

<div id="overlay">
  <div class="big" id="ov-icon">⏳</div>
  <div class="msg" id="ov-msg">กำลังส่งข้อมูล...</div>
  <div class="sub" id="ov-sub"></div>
</div>

<script>
// ================== ตั้งค่า (แก้ 2 บรรทัดนี้ตอนติดตั้ง) ==================
var LIFF_ID = '2010658196-oX7HbG4T';
var GAS_URL = 'https://script.google.com/macros/s/AKfycbw2dmmEqiC5y35oyROABYUy5IxCt3m_WFD6M6YjssONERlgBg6-Ec8i8Jfe3ZLw8KG4/exec';
// =====================================================================

var OPT = {};          // ตัวเลือกจากชีท
var acts = [];         // กิจกรรมที่เลือก
var pests = [];        // โรค/แมลงที่เลือก

function $(id) { return document.getElementById(id); }

function fillSelect(el, list, noneLabel) {
  el.innerHTML = '';
  if (noneLabel) el.appendChild(new Option(noneLabel, ''));
  (list || []).forEach(function (v) { el.appendChild(new Option(v, v)); });
}

function makeChips(container, list, selected, single) {
  container.innerHTML = '';
  (list || []).forEach(function (v) {
    var c = document.createElement('div');
    c.className = 'chip'; c.textContent = v;
    c.onclick = function () {
      var isNone = function (t) { return t.indexOf('ไม่พบ') === 0; };
      var i = selected.indexOf(v);
      if (i >= 0) { selected.splice(i, 1); c.classList.remove('on'); }
      else {
        if (isNone(v) || single) { selected.length = 0; container.querySelectorAll('.chip').forEach(function (x) { x.classList.remove('on'); }); }
        else {
          for (var ni = selected.length - 1; ni >= 0; ni--) { if (isNone(selected[ni])) selected.splice(ni, 1); }
          container.querySelectorAll('.chip').forEach(function (x) { if (isNone(x.textContent)) x.classList.remove('on'); });
        }
        selected.push(v); c.classList.add('on');
      }
      onActsChange(); validate();
    };
    container.appendChild(c);
  });
}

function hasAct(kw) { return acts.some(function (a) { return a.indexOf(kw) >= 0; }); }
function actIsWater(a) { return a.indexOf('รดน้ำ') >= 0; }
function actIsSpray(a) { return a.indexOf('ฉีดพ่นทางใบ') >= 0 || a.indexOf('พ่นยา') >= 0 || a.indexOf('พ่นชีวภัณฑ์') >= 0; }
function actIsFert(a) { return !actIsSpray(a) && (a.indexOf('ปุ๋ย') >= 0 || a.indexOf('ใส่') >= 0 || a.indexOf('ราดสาร') >= 0); }

// ---------- ถังพ่น: หลายแปลง × หลายสาร ----------
var SPRAY_CATS = [
  { key: 'insect', opt: 'ยาฆ่าแมลง (IRAC)', title: '🐛 ยาฆ่าแมลง/ไร', f: 'ยาฆ่าแมลง', q: 'ปริมาณยาฆ่าแมลง', u: 'หน่วยยาฆ่าแมลง', drug: true },
  { key: 'fung', opt: 'ยากำจัดโรคพืช (FRAC)', title: '🍄 ยากำจัดโรค', f: 'ยากำจัดโรคพืช', q: 'ปริมาณยากำจัดโรค', u: 'หน่วยยากำจัดโรค', drug: true },
  { key: 'fert', opt: 'ปุ๋ย', title: '🌿 ปุ๋ย/อาหารเสริม/สารจับใบ', f: 'ปุ๋ย', q: 'ปริมาณปุ๋ย', u: 'หน่วยปุ๋ย', drug: false },
  { key: 'bio', opt: 'ชีวภัณฑ์', title: '🦠 ชีวภัณฑ์', f: 'ชีวภัณฑ์', q: 'ปริมาณชีวภัณฑ์', u: 'หน่วยชีวภัณฑ์', drug: false }
];
function sprayCat(key) { return SPRAY_CATS.filter(function (c) { return c.key === key; })[0]; }
function defaultWater(plot) {
  if (plot.indexOf('ทั้งหมด') >= 0) return 800;
  if (plot.indexOf('หนองสาหร่าย 3') >= 0) return 20;
  return 200;
}
function shortName(n) { return String(n).replace(/^\[[^\]]*\]\s*/, '').replace(/\s*\(.*$/, '').replace(/\s+-\s+.*$/, ''); }
function shortUnit(u) { return String(u).replace(/\s*\(.*\)\s*$/, ''); }
function round2(x) { return Math.round(x * 100) / 100; }

function buildSprayPlots() {
  var box = $('spray-plots'); box.innerHTML = '';
  (OPT['แปลง'] || []).forEach(function (p) {
    var d = document.createElement('div'); d.className = 'plot-line';
    d.innerHTML = '<label class="pl"><input type="checkbox" class="sp-on"><span></span></label>' +
      '<input type="number" class="sp-water" inputmode="decimal"><span class="l">ลิตร</span>';
    d.querySelector('span').textContent = p;
    d.dataset.plot = p;
    d.querySelector('.sp-water').value = defaultWater(p);
    d.querySelector('.sp-on').onchange = function () { updateSprayPreview(); validate(); };
    d.querySelector('.sp-water').oninput = function () { updateSprayPreview(); validate(); };
    box.appendChild(d);
  });
}

function addSprayRow() {
  var div = document.createElement('div');
  div.className = 'multi-row';
  div.innerHTML =
    '<label>สาร</label><select class="sr-prod"></select>' +
    '<div class="row">' +
      '<div><label>ต่อน้ำ 200 ลิตร</label><input type="number" class="sr-qty" inputmode="decimal" placeholder="เช่น 60"></div>' +
      '<div><label>หน่วย</label><select class="sr-unit"></select></div>' +
    '</div>' +
    '<div class="mr-actions"><span class="mr-remove">✕ ลบสารนี้</span></div>';
  var sel = div.querySelector('.sr-prod');
  sel.appendChild(new Option('— เลือกสาร —', ''));
  SPRAY_CATS.forEach(function (c) {
    var g = document.createElement('optgroup'); g.label = c.title;
    (OPT[c.opt] || []).forEach(function (v) { g.appendChild(new Option(v, c.key + '|' + v)); });
    sel.appendChild(g);
  });
  fillSelect(div.querySelector('.sr-unit'), OPT['หน่วย'], '— หน่วย —');
  [sel, div.querySelector('.sr-unit')].forEach(function (el) { el.onchange = function () { updateSprayPreview(); validate(); }; });
  div.querySelector('.sr-qty').oninput = function () { updateSprayPreview(); validate(); };
  div.querySelector('.mr-remove').onclick = function () {
    div.remove();
    if (!$('spray-rows').children.length) addSprayRow();
    updateSprayPreview(); validate();
  };
  $('spray-rows').appendChild(div);
}

function sprayPlots() {
  var out = [];
  $('spray-plots').querySelectorAll('.plot-line').forEach(function (d) {
    var w = parseFloat(d.querySelector('.sp-water').value);
    if (d.querySelector('.sp-on').checked) out.push({ plot: d.dataset.plot, water: w });
  });
  return out;
}
function sprayProducts() {
  var out = [];
  $('spray-rows').querySelectorAll('.multi-row').forEach(function (r) {
    var v = r.querySelector('.sr-prod').value;
    if (!v) return;
    var i = v.indexOf('|');
    out.push({ cat: v.slice(0, i), name: v.slice(i + 1), qty: parseFloat(r.querySelector('.sr-qty').value), unit: r.querySelector('.sr-unit').value });
  });
  return out;
}
function sprayHasDrug() { return sprayProducts().some(function (p) { return sprayCat(p.cat).drug; }); }

function updateSprayPreview() {
  var plots = sprayPlots(), prods = sprayProducts().filter(function (p) { return p.qty > 0 && p.unit; });
  var box = $('spray-preview');
  if (!plots.length || !prods.length) { box.classList.add('hidden'); return; }
  var html = '<b>ระบบจะบันทึกยอดรวมแต่ละแปลงดังนี้</b>';
  plots.forEach(function (pl) {
    var items = prods.map(function (p) { return shortName(p.name) + ' ' + round2(p.qty * (pl.water || 0) / 200) + ' ' + shortUnit(p.unit); });
    var div = document.createElement('div'); div.textContent = '• ' + pl.plot + ' (น้ำ ' + (pl.water || 0) + ' ลิตร): ' + items.join(', ');
    html += div.outerHTML;
  });
  box.innerHTML = html; box.classList.remove('hidden');
}

function sprayValid() {
  var plots = sprayPlots();
  if (!plots.length || plots.some(function (p) { return !(p.water > 0); })) return false;
  var rows = $('spray-rows').querySelectorAll('.multi-row'), any = false, bad = false;
  rows.forEach(function (r) {
    var v = r.querySelector('.sr-prod').value, q = parseFloat(r.querySelector('.sr-qty').value), u = r.querySelector('.sr-unit').value;
    if (!v && !r.querySelector('.sr-qty').value) return;  // แถวว่าง ข้ามได้
    if (v && q > 0 && u) any = true; else bad = true;
  });
  return any && !bad;
}

function fileToBase64(file, maxW) {
  return new Promise(function (resolve) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxW / img.width);
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        try { resolve(c.toDataURL('image/jpeg', 0.6).split(',')[1]); } catch (e) { resolve(''); }
      };
      img.onerror = function () { resolve(''); };
      img.src = reader.result;
    };
    reader.onerror = function () { resolve(''); };
    reader.readAsDataURL(file);
  });
}

// ---------- แถวรดน้ำ/ปุ๋ยแบบเพิ่มได้หลายแปลง ----------
function addWaterRow() {
  var div = document.createElement('div');
  div.className = 'multi-row';
  div.innerHTML =
    '<label>แปลง</label><select class="mr-plot"></select>' +
    '<div class="row">' +
      '<div><label>ช่วงเวลา</label><select class="mr-time"></select></div>' +
      '<div><label>รดนานแค่ไหน</label><select class="mr-dur"></select></div>' +
    '</div>' +
    '<div class="mr-actions"><span class="mr-remove">✕ ลบแปลงนี้</span></div>';
  $('water-rows').appendChild(div);
  fillSelect(div.querySelector('.mr-plot'), OPT['แปลง'], '— เลือกแปลง —');
  fillSelect(div.querySelector('.mr-time'), OPT['ช่วงเวลารดน้ำ'], '— เลือก —');
  fillSelect(div.querySelector('.mr-dur'), OPT['ระยะเวลารดน้ำ'], '— เลือก —');
  div.querySelector('.mr-plot').onchange = validate;
  div.querySelector('.mr-remove').onclick = function () {
    div.remove();
    if (!$('water-rows').children.length) addWaterRow();
    validate();
  };
}

function addFertRow() {
  var div = document.createElement('div');
  div.className = 'multi-row';
  div.innerHTML =
    '<label>แปลง</label><select class="mr-plot"></select>' +
    '<label>ปุ๋ยที่ใส่</label><select class="mr-fert"></select>' +
    '<div class="row">' +
      '<div><label>ปริมาณ</label><input type="number" class="mr-qty" inputmode="decimal" placeholder="เช่น 1"></div>' +
      '<div><label>หน่วย</label><select class="mr-unit"></select></div>' +
    '</div>' +
    '<div class="mr-actions"><span class="mr-remove">✕ ลบแปลงนี้</span></div>';
  $('fert-rows').appendChild(div);
  fillSelect(div.querySelector('.mr-plot'), OPT['แปลง'], '— เลือกแปลง —');
  fillSelect(div.querySelector('.mr-fert'), OPT['ปุ๋ย'], '— เลือกปุ๋ย —');
  fillSelect(div.querySelector('.mr-unit'), OPT['หน่วย'], '— หน่วย —');
  div.querySelector('.mr-plot').onchange = validate;
  div.querySelector('.mr-remove').onclick = function () {
    div.remove();
    if (!$('fert-rows').children.length) addFertRow();
    validate();
  };
}

function waterRowsValid() {
  var rows = $('water-rows').querySelectorAll('.multi-row');
  if (!rows.length) return false;
  var any = false;
  rows.forEach(function (r) { if (r.querySelector('.mr-plot').value) any = true; });
  return any;
}
function fertRowsValid() {
  var rows = $('fert-rows').querySelectorAll('.multi-row');
  if (!rows.length) return false;
  var any = false;
  rows.forEach(function (r) { if (r.querySelector('.mr-plot').value) any = true; });
  return any;
}

// ---------- สถานะฟอร์ม ----------
function computeState() {
  var hasWater = acts.some(actIsWater);
  var hasFert = acts.some(actIsFert);
  var otherActs = acts.filter(function (a) { return !actIsWater(a) && !actIsFert(a) && !actIsSpray(a); });
  var needsMainPlot = otherActs.length > 0 || pests.length > 0 || $('f-note').value.trim().length > 0;
  return { hasWater: hasWater, hasFert: hasFert, otherActs: otherActs, needsMainPlot: needsMainPlot };
}

function toggleSection(sectionId, show, listId, addFn) {
  var wasHidden = $(sectionId).classList.contains('hidden');
  $(sectionId).classList.toggle('hidden', !show);
  if (show && wasHidden) {
    $(listId).innerHTML = '';
    addFn();
  }
  if (!show) {
    $(listId).innerHTML = '';
  }
}

function onActsChange() {
  var st = computeState();
  toggleSection('sec-water', st.hasWater, 'water-rows', addWaterRow);
  toggleSection('sec-fert', st.hasFert, 'fert-rows', addFertRow);
  var showSpray = acts.some(actIsSpray);
  if (showSpray && $('sec-spray').classList.contains('hidden') && !$('spray-rows').children.length) addSprayRow();
  $('sec-spray').classList.toggle('hidden', !showSpray);
  $('block-plot').classList.toggle('hidden', !st.needsMainPlot);
  validate();
}

function hasPhoto(id) { var el = $(id); return !!(el && el.files && el.files.length); }

function validate() {
  var st = computeState();
  var ok = acts.length > 0;
  if (st.hasWater) ok = ok && waterRowsValid();
  if (st.hasFert) ok = ok && fertRowsValid();
  if (st.needsMainPlot) ok = ok && !!$('f-plot').value;
  var missPhoto = false;
  if (!$('sec-spray').classList.contains('hidden')) {
    ok = ok && sprayValid();
    var needPhoto = sprayHasDrug();
    $('spray-photo-req').textContent = needPhoto ? '* ต้องถ่ายทุกครั้งที่มียา' : '(ถ้ามี)';
    if (needPhoto && !hasPhoto('f-spray-photo')) { missPhoto = true; ok = false; }
  }
  $('submit-hint').textContent = missPhoto ? '📷 ยังไม่ได้ถ่ายรูปฉลากยา — ถ่ายก่อนจึงจะส่งได้' : '';
  $('btn-submit').disabled = !ok;
}

function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function overlay(icon, msg, sub) {
  $('ov-icon').textContent = icon; $('ov-msg').textContent = msg; $('ov-sub').textContent = sub || '';
  $('overlay').style.display = 'flex';
}

// ---------- อ่านรูปฉลากยา + ย่อขนาดก่อนส่ง (กันไฟล์ใหญ่เกิน) ----------
function readPhotoAsBase64(inputEl, maxW) {
  return new Promise(function (resolve) {
    var file = inputEl.files && inputEl.files[0];
    if (!file) { resolve(''); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        try { resolve(c.toDataURL('image/jpeg', 0.6).split(',')[1]); }
        catch (e) { resolve(''); }
      };
      img.onerror = function () { resolve(''); };
      img.src = reader.result;
    };
    reader.onerror = function () { resolve(''); };
    reader.readAsDataURL(file);
  });
}

// ---------- โหลดตัวเลือกและโปรไฟล์ ----------
function init() {
  $('f-date').value = todayISO();
  $('btn-add-water').onclick = addWaterRow;
  $('btn-add-fert').onclick = addFertRow;
  $('f-note').oninput = onActsChange;
  $('f-plot').onchange = validate;
  $('btn-add-spray').onclick = function () { addSprayRow(); validate(); };
  $('f-spray-photo').onchange = function () {
    var n = $('f-spray-photo').files.length;
    $('spray-photo-count').textContent = n ? ('ถ่ายแล้ว ' + n + ' รูป ✅ (กดอีกครั้งเพื่อถ่ายใหม่/เลือกหลายรูป)') : '';
    validate();
  };

  fetch(GAS_URL + '?action=options')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      OPT = j.options || {};
      var noSep = function (list) { return (list || []).filter(function (v) { return v.indexOf('—') < 0; }); };
      var units = OPT['หน่วย'];
      fillSelect($('f-plot'), OPT['แปลง'], '— เลือกแปลง —');
      makeChips($('f-acts'), OPT['กิจกรรมหลัก'], acts);
      makeChips($('f-pests'), noSep(OPT['โรคและแมลงที่พบ']), pests);
      buildSprayPlots();
    })
    .catch(function () {
      overlay('⚠️', 'โหลดตัวเลือกไม่ได้', 'เช็คอินเทอร์เน็ตแล้วเปิดฟอร์มใหม่อีกครั้ง');
    });

  liff.init({ liffId: LIFF_ID })
    .then(function () {
      if (!liff.isLoggedIn() && !liff.isInClient()) { liff.login(); return; }
      return liff.getProfile();
    })
    .then(function (p) {
      if (p) { $('f-name').value = p.displayName; $('who').textContent = 'ผู้บันทึก: ' + p.displayName; }
    })
    .catch(function () { $('who').textContent = 'กรอกชื่อผู้บันทึกด้านล่าง'; });
}

// ---------- ส่งข้อมูล ----------
$('btn-submit').onclick = async function () {
  $('btn-submit').disabled = true;
  overlay('⏳', 'กำลังเตรียมข้อมูล...', '');

  var dateVal = $('f-date').value; // ส่งเป็น yyyy-mm-dd ฝั่งสคริปต์แปลงเป็น Date เอง
  var recorder = $('f-name').value.trim() || 'ไม่ระบุ';
  var st = computeState();
  var records = [];

  // ถ่ายรูปฉลากยา (ถ้ามีและหมวดนั้นเปิดอยู่) — ย่อขนาดก่อนส่งกันช้า
  var photos = [];
  if (!$('sec-spray').classList.contains('hidden')) {
    var files = Array.prototype.slice.call($('f-spray-photo').files || [], 0, 6);
    for (var fi = 0; fi < files.length; fi++) { var b64 = await fileToBase64(files[fi], 1000); if (b64) photos.push(b64); }
  }

  // รดน้ำ — 1 แถวต่อแปลงที่เลือก
  $('water-rows').querySelectorAll('.multi-row').forEach(function (r) {
    var plot = r.querySelector('.mr-plot').value;
    if (!plot) return;
    records.push({
      _type: 'water', 'วันที่': dateVal, 'แปลง': plot, 'กิจกรรมหลัก': 'รดน้ำ',
      'ช่วงเวลารดน้ำ': r.querySelector('.mr-time').value,
      'ระยะเวลารดน้ำ': r.querySelector('.mr-dur').value,
      'ผู้บันทึก': recorder
    });
  });

  // ใส่ปุ๋ย — 1 แถวต่อแปลงที่เลือก
  $('fert-rows').querySelectorAll('.multi-row').forEach(function (r) {
    var plot = r.querySelector('.mr-plot').value;
    if (!plot) return;
    records.push({
      _type: 'fert', 'วันที่': dateVal, 'แปลง': plot, 'กิจกรรมหลัก': 'ใส่ปุ๋ย',
      'ปุ๋ย': r.querySelector('.mr-fert').value,
      'ปริมาณปุ๋ย': r.querySelector('.mr-qty').value,
      'หน่วยปุ๋ย': r.querySelector('.mr-unit').value,
      'ผู้บันทึก': recorder
    });
  });

  // ถังพ่น — 1 แถวต่อ (แปลง × สาร) ปริมาณ = ต่อ 200 ลิตร × น้ำจริง ÷ 200
  if (!$('sec-spray').classList.contains('hidden')) {
    var sprayActs = acts.filter(actIsSpray).join(', ');
    var prods = sprayProducts().filter(function (p) { return p.qty > 0 && p.unit; });
    sprayPlots().forEach(function (pl) {
      prods.forEach(function (p) {
        var c = sprayCat(p.cat), rec = {
          _type: 'spray', 'วันที่': dateVal, 'แปลง': pl.plot, 'กิจกรรมหลัก': sprayActs,
          'หมายเหตุ': 'ถังพ่น น้ำ ' + pl.water + ' ลิตร (สูตรต่อ 200 ลิตร: ' + p.qty + ' ' + shortUnit(p.unit) + ')',
          'ผู้บันทึก': recorder
        };
        rec[c.f] = p.name; rec[c.q] = round2(p.qty * pl.water / 200); rec[c.u] = p.unit;
        records.push(rec);
      });
    });
  }

  // กิจกรรมอื่น (ตัดแต่งกิ่ง/เก็บเกี่ยว/ตรวจแปลง/กำจัดวัชพืช ฯลฯ /โรคแมลงที่พบ/หมายเหตุ) — ใช้แปลงหลักเดียว
  if (st.needsMainPlot && $('f-plot').value) {
    records.push({
      _type: 'other', 'วันที่': dateVal, 'แปลง': $('f-plot').value,
      'กิจกรรมหลัก': st.otherActs.join(', '),
      'โรคและแมลงที่พบ': pests.join(', '),
      'หมายเหตุ': $('f-note').value.trim(),
      'ผู้บันทึก': recorder
    });
  }

  if (!records.length) { $('btn-submit').disabled = false; $('overlay').style.display = 'none'; return; }

  overlay('⏳', 'กำลังส่งข้อมูล...', photos.length ? 'กำลังอัปโหลดรูป ' + photos.length + ' รูป รอสักครู่...' : '');
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'submit', data: records, photos: photos })
  })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.ok) {
        overlay('✅', 'บันทึกเรียบร้อย!', 'ปิดหน้านี้ได้เลย');
        setTimeout(function () { if (liff.isInClient()) liff.closeWindow(); }, 1800);
      } else { throw new Error(j.error || 'save failed'); }
    })
    .catch(function () {
      overlay('❌', 'ส่งไม่สำเร็จ', 'เช็คอินเทอร์เน็ตแล้วลองกดส่งใหม่');
      $('btn-submit').disabled = false;
      setTimeout(function () { $('overlay').style.display = 'none'; }, 2500);
    });
};

init();
</script>

</html>
